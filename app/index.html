<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Object Extractor</title>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Video Object Extractor</h1>
        <p class="subtitle">
          Pick a video. Objects are detected and cropped — everything runs in your browser,
          nothing is uploaded.
        </p>
      </header>

      <section id="drop-zone" class="drop-zone">
        <input
          type="file"
          id="file-input"
          accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov,.m4v"
          hidden
        />
        <p class="drop-hint">Drop a video here, or <button id="pick-btn" class="link">choose a file</button></p>
        <p class="filename" id="filename"></p>
      </section>

      <section class="controls">
        <label>
          <span>Sample rate: <strong id="fps-label">5</strong> fps</span>
          <input type="range" id="fps-slider" min="1" max="15" value="5" step="1" />
        </label>
        <label>
          <span>Confidence: <strong id="thresh-label">0.40</strong></span>
          <input type="range" id="thresh-slider" min="0.1" max="0.9" value="0.4" step="0.05" />
        </label>
        <button id="start-btn" disabled>Start</button>
      </section>

      <section class="status">
        <div class="status-msg" id="status-msg">Pick a video to begin.</div>
        <div class="progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </section>

      <section class="results">
        <div class="results-header">
          <h2>Objects found: <span id="obj-count">0</span></h2>
          <button id="download-btn" disabled>Download ZIP</button>
        </div>
        <div id="thumbnails" class="thumbnails"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
